name: Windows EXE
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Prepare dedicated caption workspace
        shell: pwsh
        run: |
          $desktop = [Environment]::GetFolderPath('Desktop')
          $project = Join-Path $desktop 'StableCaptions-Workspace/Project_Public'
          New-Item -ItemType Directory -Force $project | Out-Null
          Get-ChildItem -Force $env:GITHUB_WORKSPACE | Copy-Item -Destination $project -Recurse -Force
          "CAPTION_PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem "$env:CAPTION_PROJECT/scripts/*.ps1" | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Install dependencies and build both apps without Azure keys
        shell: pwsh
        run: |
          Set-Location $env:CAPTION_PROJECT
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/scan_public.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/build.py --variant all
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: StableCaptions-Windows
          path: ${{ env.CAPTION_PROJECT }}/dist/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StableCaptions-Windows
          path: packages
      - name: Publish verified key-free packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/*.zip --repo "$GITHUB_REPOSITORY" --generate-notes
